name: Build Platforms

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: 'Build macOS'
        required: true
        default: true
        type: boolean
      build_windows:
        description: 'Build Windows'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--max-old-space-size=6144"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  LOBSTERAI_UNSIGNED_BUILD: "1"
  LOBSTERAI_UNSIGNED_WINDOWS: "1"

jobs:
  # ========== macOS 构建 ==========
  build-macos:
    if: ${{ github.event_name == 'push' || inputs.build_macos }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      LOBSTERAI_UNSIGNED_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # 1. npm 下载缓存
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}

      # 2. pnpm store 缓存
      - name: Cache pnpm Store
        uses: actions/cache@v4
        with:
          path: ~/Library/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('package.json') }}

      # 3. Electron prebuilt 与 electron-builder 缓存
      - name: Cache Electron & Electron-builder Tools
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-tools-${{ runner.os }}-${{ hashFiles('package.json') }}

      # 4. OpenClaw 18 个扩展插件缓存
      - name: Cache OpenClaw Plugins
        uses: actions/cache@v4
        with:
          path: vendor/openclaw-plugins
          key: openclaw-plugins-${{ hashFiles('package.json') }}

      # 5. OpenClaw 编译后运行时缓存 (mac-arm64)
      - name: Cache OpenClaw Runtime (mac-arm64)
        uses: actions/cache@v4
        with:
          path: vendor/openclaw-runtime/mac-arm64
          key: openclaw-runtime-mac-arm64-${{ hashFiles('scripts/patches/**', 'package.json', 'scripts/*openclaw*') }}

      # 6. Skill 依赖缓存 (SKILLs/*/node_modules)
      - name: Cache Skill Dependencies
        uses: actions/cache@v4
        with:
          path: |
            SKILLs/imap-smtp-email/node_modules
            SKILLs/pptx/node_modules
            SKILLs/web-search/node_modules
          key: skill-deps-${{ runner.os }}-${{ hashFiles('SKILLs/*/package.json') }}

      - run: npm install -g pnpm
      - name: Install Dependencies
        timeout-minutes: 10
        run: npm install

      # 设置 OpenClaw runtime (如已命中缓存直接建立 current 软链接)
      - name: Setup OpenClaw Runtime
        run: |
          if [ -f "vendor/openclaw-runtime/mac-arm64/gateway.asar" ]; then
            node scripts/sync-openclaw-runtime-current.cjs mac-arm64
            echo "✓ OpenClaw runtime mac-arm64 cache hit, synced to current"
          else
            echo "ℹ OpenClaw runtime cache missed, building from source"
            npm run openclaw:runtime:mac-arm64
          fi

      - name: Build macOS
        timeout-minutes: 50
        run: |
          npm run build
          npm run compile:electron
          npm run build:skills
          npx electron-builder --mac --arm64 --config scripts/electron-builder-config.cjs --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 7

  # ========== Windows 构建 ==========
  build-windows:
    if: ${{ github.event_name == 'push' || inputs.build_windows }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      LOBSTERAI_UNSIGNED_WINDOWS: "1"
      LOBSTERAI_UNSIGNED_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # 1. npm 下载缓存
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}

      # 2. pnpm store 缓存
      - name: Cache pnpm Store
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pnpm\store
          key: pnpm-${{ runner.os }}-${{ hashFiles('package.json') }}

      # 3. Electron prebuilt 与 electron-builder 缓存
      - name: Cache Electron & Electron-builder Tools
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-tools-${{ runner.os }}-${{ hashFiles('package.json') }}

      # 4. Windows 便携外部运行时 (Python & MinGit) 缓存
      - name: Cache Windows External Runtimes
        uses: actions/cache@v4
        with:
          path: |
            resources/python-win
            resources/mingit
          key: win-ext-runtimes-${{ hashFiles('scripts/setup-python-runtime.js', 'scripts/setup-mingit.js') }}

      # 5. OpenClaw 18 个扩展插件缓存
      - name: Cache OpenClaw Plugins
        uses: actions/cache@v4
        with:
          path: vendor/openclaw-plugins
          key: openclaw-plugins-${{ hashFiles('package.json') }}

      # 6. OpenClaw 编译后运行时缓存 (win-x64)
      - name: Cache OpenClaw Runtime (win-x64)
        uses: actions/cache@v4
        with:
          path: vendor/openclaw-runtime/win-x64
          key: openclaw-runtime-win-x64-${{ hashFiles('scripts/patches/**', 'package.json', 'scripts/*openclaw*') }}

      # 7. Skill 依赖缓存 (SKILLs/*/node_modules)
      - name: Cache Skill Dependencies
        uses: actions/cache@v4
        with:
          path: |
            SKILLs/imap-smtp-email/node_modules
            SKILLs/pptx/node_modules
            SKILLs/web-search/node_modules
          key: skill-deps-${{ runner.os }}-${{ hashFiles('SKILLs/*/package.json') }}

      - run: npm install -g pnpm
      - name: Install Dependencies
        timeout-minutes: 10
        run: npm install

      # Windows 需要 Python 运行时
      - name: Setup Python Runtime
        timeout-minutes: 10
        run: npm run setup:python-runtime
        env:
          LOBSTERAI_PORTABLE_PYTHON_ARCHIVE: ${{ secrets.WINDOWS_PYTHON_ARCHIVE }}

      # 设置 OpenClaw runtime (如已命中缓存直接建立 current 软链接)
      - name: Setup OpenClaw Runtime
        shell: pwsh
        run: |
          if (Test-Path "vendor/openclaw-runtime/win-x64/gateway.asar") {
            node scripts/sync-openclaw-runtime-current.cjs win-x64
            Write-Host "✓ OpenClaw runtime win-x64 cache hit, synced to current"
          } else {
            Write-Host "ℹ OpenClaw runtime cache missed, building from source"
            npm run openclaw:runtime:win-x64
          }

      # 在打包前生成 build-identity 标记 (打包进 app.asar)
      - name: Stamp Build Marker
        run: node .circleci/artifact-identity.cjs stamp

      - name: Build Windows
        timeout-minutes: 50
        shell: bash
        run: |
          npm run verify:installer-patches
          npm run setup:python-runtime
          npm run build
          npm run compile:electron
          npm run build:skills
          npx electron-builder --win --x64 --config scripts/electron-builder-config.cjs --publish never

      # 收集 Windows 安装包与身份元数据 (生成 UPDATE_IDENTITY.json)
      - name: Collect Windows Installer & Identity
        run: node .circleci/artifact-identity.cjs collect

      # 自动导入并推送到更新平台 updates.a-j.app
      - name: Import Windows Dev Update to updates.a-j.app
        if: env.LOBSTERAI_UPDATES_IMPORT_TOKEN != ''
        timeout-minutes: 20
        run: node .circleci/import-windows.cjs
        env:
          LOBSTERAI_UPDATES_IMPORT_TOKEN: ${{ secrets.LOBSTERAI_UPDATES_IMPORT_TOKEN }}
          CIRCLE_PROJECT_ID: "0482e18c-23dd-4029-a3f8-237687fe401d"
          CIRCLE_BRANCH: ${{ github.ref_name }}
          CIRCLE_SHA1: ${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7

  # ========== 创建 Release ==========
  create-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/macos-build/*.dmg
            artifacts/windows-build/*.exe
          draft: true
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

