version: 2.1

jobs:
  runtime-core-windows:
    machine: &windows-machine
      image: windows-server-2022-gui:current
    resource_class: windows.medium
    shell: powershell.exe -ExecutionPolicy Bypass
    environment: &windows-environment
      CIRCLE_PROJECT_ID: "0482e18c-23dd-4029-a3f8-237687fe401d"
      CIRCLE_PIPELINE_ID: "<< pipeline.id >>"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - checkout
      - run: &begin-budget
          name: Initialize absolute 55-minute job deadline
          command: .\.circleci\run-build.ps1 begin-budget
          no_output_timeout: 2m
      # Cache/workspace waits consume the absolute deadline at the next command.
      # Tools/downloads use their existing caches. Compiled caches below are
      # exact source/toolchain identities, independent of HEAD/app version.
      - restore_cache: &restore-toolchain
          keys:
            - win2022-x64-toolchain-v2-node24.15.0-npm11.17.0-pnpm12.1.0
            - win2022-x64-toolchain-v1-node24.15.0-npm11.17.0-pnpm12.1.0-
      - restore_cache: &restore-downloads
          keys:
            - win2022-x64-downloads-v2-node24.15.0-npm11.17.0-pnpm12.1.0-
            - win2022-x64-downloads-v1-node24.15.0-npm11.17.0-pnpm12.1.0-
      - run: &install-toolchain
          name: Setup Toolchain (Node 24.15.0, npm, pnpm)
          command: .\.circleci\run-build.ps1 install-toolchain
          no_output_timeout: 12m
      - save_cache: &save-toolchain
          key: win2022-x64-toolchain-v2-node24.15.0-npm11.17.0-pnpm12.1.0
          paths:
            - 'C:/tools/node-v24.15.0-win-x64'
      - run: &dependency-cache-keys
          name: Generate exact dependency-cache key before restore
          command: .\.circleci\run-build.ps1 dependency-cache-keys
          no_output_timeout: 2m
      - restore_cache: &restore-dependencies
          keys:
            - lobster-dependencies-win2022-x64-node24.15.0-npm11.17.0-pnpm12.1.0-v1-{{ checksum ".circleci-dependency-keys/root.txt" }}
      - run: &dependencies
          name: Validate dependency cache or install (10m install, absolute job deadline)
          command: .\.circleci\run-build.ps1 dependencies
          no_output_timeout: 57m
      - save_cache:
          key: lobster-dependencies-win2022-x64-node24.15.0-npm11.17.0-pnpm12.1.0-v1-{{ checksum ".circleci-dependency-keys/root.txt" }}
          paths:
            - 'node_modules'
            - 'package-lock.json'
            - '.circleci-dependency-cache/manifest.json'
      - run:
          name: Generate exact compiled-cache keys before restore
          command: .\.circleci\run-build.ps1 runtime-cache-keys
          no_output_timeout: 2m
      - restore_cache:
          keys:
            - openclaw-compiled-core-win2022-x64-node24.15.0-npm11.17.0-pnpm12.1.0-{{ checksum ".circleci-runtime-keys/core.txt" }}
      - run:
          name: Validate or build, bundle and snapshot core (40m phase, 35m build)
          command: .\.circleci\run-build.ps1 runtime-core
          no_output_timeout: 42m
      # Must precede plugins: a plugin failure still retains the real core.
      - save_cache:
          key: openclaw-compiled-core-win2022-x64-node24.15.0-npm11.17.0-pnpm12.1.0-{{ checksum ".circleci-runtime-keys/core.txt" }}
          paths:
            - '.circleci-runtime-cache/core'
      # Save downloads after useful core work, not before its build budget.
      - save_cache: &save-downloads-runtime
          key: win2022-x64-downloads-v2-node24.15.0-npm11.17.0-pnpm12.1.0-{{ .BuildNum }}-{{ .Environment.CIRCLE_JOB }}
          paths:
            - 'C:/lobsterai-cache/npm/_cacache'
            - 'C:/lobsterai-cache/electron'
            - 'C:/lobsterai-cache/pnpm-store'
            - 'C:/lobsterai-cache/electron-builder'
      - run:
          name: Export verified current-commit core workspace (job deadline, reuse snapshot)
          command: .\.circleci\run-build.ps1 export-core
          no_output_timeout: 57m
      - persist_to_workspace:
          root: '.circleci-workspace'
          paths:
            - core/runtime.tar
            - core/manifest.json

  runtime-windows:
    machine: *windows-machine
    resource_class: windows.medium
    shell: powershell.exe -ExecutionPolicy Bypass
    environment: *windows-environment
    steps:
      - checkout
      - run: *begin-budget
      - restore_cache: *restore-toolchain
      - restore_cache: *restore-downloads
      - run: *install-toolchain
      - save_cache: *save-toolchain
      - run: *dependency-cache-keys
      - restore_cache: *restore-dependencies
      - run: *dependencies
      - run:
          name: Generate exact compiled-cache keys before import and restore
          command: .\.circleci\run-build.ps1 runtime-cache-keys
          no_output_timeout: 2m
      - attach_workspace:
          at: '.circleci-workspace'
      - run:
          name: Import required verified core and recreate current (job deadline + 2m sync)
          command: .\.circleci\run-build.ps1 import-core
          no_output_timeout: 57m
      - restore_cache:
          keys:
            - openclaw-compiled-plugins-win2022-x64-node24.15.0-npm11.17.0-pnpm12.1.0-{{ checksum ".circleci-runtime-keys/plugins.txt" }}
      - restore_cache:
          keys:
            - openclaw-compiled-full-win2022-x64-node24.15.0-npm11.17.0-pnpm12.1.0-{{ checksum ".circleci-runtime-keys/full.txt" }}
      - run:
          name: Validate or install published plugins and snapshot (40m phase, 30m install)
          command: .\.circleci\run-build.ps1 runtime-published
          no_output_timeout: 42m
      # Only a successful published install/validated hit may save this stage.
      - save_cache:
          key: openclaw-compiled-plugins-win2022-x64-node24.15.0-npm11.17.0-pnpm12.1.0-{{ checksum ".circleci-runtime-keys/plugins.txt" }}
          paths:
            - '.circleci-runtime-cache/plugins'
      - run:
          name: Validate full hit or build local remainder and snapshot (40m phase)
          command: .\.circleci\run-build.ps1 runtime-remainder
          no_output_timeout: 42m
      - save_cache:
          key: openclaw-compiled-full-win2022-x64-node24.15.0-npm11.17.0-pnpm12.1.0-{{ checksum ".circleci-runtime-keys/full.txt" }}
          paths:
            - '.circleci-runtime-cache/full'
      - save_cache: *save-downloads-runtime
      - run:
          name: Export verified runtime workspace (job deadline, reuse snapshot)
          command: .\.circleci\run-build.ps1 export-runtime
          no_output_timeout: 57m
      - persist_to_workspace:
          root: '.circleci-workspace'
          paths:
            - full/runtime.tar
            - full/manifest.json

  build-windows:
    machine: *windows-machine
    resource_class: windows.medium
    shell: powershell.exe -ExecutionPolicy Bypass
    environment: *windows-environment
    steps:
      - checkout
      - run: *begin-budget
      - restore_cache: *restore-toolchain
      - restore_cache: *restore-downloads
      - run: *install-toolchain
      - save_cache: *save-toolchain
      - run: *dependency-cache-keys
      - restore_cache: *restore-dependencies
      - run: *dependencies
      - attach_workspace:
          at: '.circleci-workspace'
      - run:
          name: Import verified runtime and recreate current (job deadline + 2m sync)
          command: .\.circleci\run-build.ps1 import-runtime
          no_output_timeout: 57m
      - run:
          name: Verify installer patches (2m)
          command: .\.circleci\run-build.ps1 verify-installer
          no_output_timeout: 4m
      - run:
          name: Generate exact Python resource-cache key
          command: .\.circleci\run-build.ps1 resource-cache-keys
          no_output_timeout: 2m
      - restore_cache:
          keys:
            - lobster-python-win2022-x64-node24.15.0-v1-{{ checksum ".circleci-resource-keys/python.txt" }}
      - run:
          name: Validate Python resource cache and run setup health check (5m setup)
          command: .\.circleci\run-build.ps1 python
          no_output_timeout: 57m
      - save_cache:
          key: lobster-python-win2022-x64-node24.15.0-v1-{{ checksum ".circleci-resource-keys/python.txt" }}
          paths:
            - 'resources/python-win'
            - 'resources/python-win-runtime.zip'
            - '.circleci-resource-cache/python.json'
      - run:
          name: Generate exact client and skills output-cache keys
          command: .\.circleci\run-build.ps1 output-cache-keys
          no_output_timeout: 57m
      - restore_cache:
          keys:
            - lobster-client-win2022-x64-node24.15.0-npm11.17.0-v1-{{ checksum ".circleci-output-keys/client.txt" }}
      - run:
          name: Validate client output cache or build (10m build)
          command: .\.circleci\run-build.ps1 build-client
          no_output_timeout: 57m
      - run:
          name: Reuse validated Electron output or compile and capture (5m compile)
          command: .\.circleci\run-build.ps1 compile-electron
          no_output_timeout: 57m
      - save_cache:
          key: lobster-client-win2022-x64-node24.15.0-npm11.17.0-v1-{{ checksum ".circleci-output-keys/client.txt" }}
          paths:
            - 'dist'
            - 'dist-electron'
            - '.circleci-output-cache/client.json'
      - restore_cache:
          keys:
            - lobster-skills-win2022-x64-node24.15.0-npm11.17.0-v1-{{ checksum ".circleci-output-keys/skills.txt" }}
      - run:
          name: Validate skills cache or build and prepare pptx dependencies (5m each)
          command: .\.circleci\run-build.ps1 skills
          no_output_timeout: 57m
      - save_cache:
          key: lobster-skills-win2022-x64-node24.15.0-npm11.17.0-v1-{{ checksum ".circleci-output-keys/skills.txt" }}
          paths:
            - 'SKILLs/web-search/node_modules'
            - 'SKILLs/web-search/dist'
            - 'SKILLs/web-search/package-lock.json'
            - 'SKILLs/imap-smtp-email/node_modules'
            - 'SKILLs/imap-smtp-email/package-lock.json'
            - 'SKILLs/pptx/node_modules'
            - 'SKILLs/pptx/package-lock.json'
            - 'SKILLs/technology-news-search/scripts/vendor/rss-parser.bundle.js'
            - '.circleci-output-cache/skills.json'
      - run:
          name: Package unsigned Windows x64 (15m, publish never)
          command: .\.circleci\run-build.ps1 package
          no_output_timeout: 17m
      - save_cache:
          key: win2022-x64-downloads-v2-node24.15.0-npm11.17.0-pnpm12.1.0-{{ .BuildNum }}-{{ .Environment.CIRCLE_JOB }}
          paths:
            - 'C:/lobsterai-cache/npm/_cacache'
            - 'C:/lobsterai-cache/electron'
            - 'C:/lobsterai-cache/pnpm-store'
            - 'C:/lobsterai-cache/electron-builder'
      - run:
          name: Collect and Verify Artifacts
          command: .\.circleci\run-build.ps1 artifacts
          no_output_timeout: 7m
      - store_artifacts:
          path: artifacts/windows
          destination: windows-x64
      - persist_to_workspace:
          root: '.circleci-workspace'
          paths:
            - installer/UPDATE_IDENTITY.json
            - installer/BUILD_INFO.txt
            - installer/*.exe

  import-windows:
    docker:
      - image: cimg/node:24.15.0
    resource_class: small
    environment:
      CIRCLE_PROJECT_ID: "0482e18c-23dd-4029-a3f8-237687fe401d"
      CIRCLE_PIPELINE_ID: "<< pipeline.id >>"
    steps:
      - checkout
      - attach_workspace:
          at: '.circleci-workspace'
      - run:
          name: Verify installer identity and import to updates.a-j.app
          command: timeout 20m node .circleci/import-windows.cjs
          no_output_timeout: 20m

workflows:
  build:
    jobs:
      - runtime-core-windows:
          filters: &branch-only
            branches:
              only:
                - feat/smartbutler-integration
            tags:
              ignore: /.*/
      - runtime-windows:
          requires:
            - runtime-core-windows
          filters: *branch-only
      - build-windows:
          requires:
            - runtime-windows
          filters: *branch-only
      - import-windows:
          requires:
            - build-windows
          context:
            - lobsterai-windows-updates-import
          filters: *branch-only
